<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <title>Bullet Survival - Single Player</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>
<body>

<script>

window.addEventListener(

    "pageshow",

    function() {

        let navEntries =

            performance.getEntriesByType(

                "navigation"

            );

        if (

            navEntries.length > 0 &&

            navEntries[0].type === "reload"

        ) {

            window.location.href = "/";

        }

    }

);

</script>

<div id="gameUI">

    <div id="score">

        Score: 0

    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOver">

        <h1>

            Game Over

        </h1>

        <button onclick="restartGame()">

            Restart

        </button>

        <br><br>

        <button onclick="goHome()">

            Home

        </button>

    </div>

</div>

<script>

window.addEventListener(

    "load",

    () => {

        document.getElementById(

            "gameUI"

        ).style.display = "block";

    }

);

</script>

<!-- COMMON -->

<script
    src="{{ url_for('static', filename='game_rules.js') }}"
></script>

<script
    src="{{ url_for('static', filename='game_core.js') }}"
></script>

<!-- SINGLE PLAYER ONLY -->

<script
    src="{{ url_for('static', filename='script_singleplayer.js') }}"
></script>

</body>
</html>
